{% load static %}
<div class="cm-author-view mode sticky-top">
    <div class="cm-author-content ">
        <div class="cm-author-image m-img">
            <img src="{% static 'assets/img/per/per2.png' %}" alt="" fetchpriority="high" decoding="async">
        </div>
        <div class="cm-author-info">
            <h3 class="cm-author-name">عطا اسکندری‌فر</h3>
            <span class="cm-author-designation"> کارشناس امنیت سایبری || برنامه‌نویس بک‌اند</span>
        </div>
        <div class="cm-author-hiring">
            <a href="{% url 'contact:contact' %}" class="cm-btn primary">استخدام من!</a>
            <a href="#" class="cm-btn">دانلود رزومه</a>
        </div>
        <br>
        <div class="cm-author-social-links">
            <a href="#" class="social-links">
                <img src="{% static 'assets/img/icons/facebook.svg' %}" alt="facebook" height="18" width="18" class="svg" fetchpriority="high" decoding="async">
            </a>
            <a href="#" class="social-links">
                <img src="{% static 'assets/img/icons/twitter-x.svg' %}" alt="twitter-x" height="18" width="18" class="svg" fetchpriority="high" decoding="async">
            </a>
            <a href="#" class="social-links">
                <img src="{% static 'assets/img/icons/instagram.svg' %}" alt="instagram" height="18" width="18" class="svg" fetchpriority="high" decoding="async">
            </a>
            <a href="#" class="social-links">
                <img src="{% static 'assets/img/icons/linkedin.svg' %}" alt="linkedin" height="18" width="18" class="svg" fetchpriority="high" decoding="async">
            </a>
        </div>
    </div>
</div>
