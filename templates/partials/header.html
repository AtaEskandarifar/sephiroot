{% load static %}

<div class="cm-header sticky-top">
    <div class="cm-header-menu mode">
        <div class="menu-left">
            <div class="logo-area">
                <a href="{% url 'home:home' %}"><img class="light" src="{% static 'assets/img/logo/ae_transparent_no_bg.png' %}" width="1rem" height="auto" alt="axz"></a>
            </div>
            <div class="header-menu">
                <ul class="list-unstyled">
                </ul>
            </div>
        </div>
        <div class="cm-functionality cm-right">
            <div class="setting" >
                <div class="mode-switcher" id="theme-mode">
                    <img class="light svg" src="{% static 'assets/img/icons/moon.svg' %}" alt="">
                    <img class="dark svg" src="{% static 'assets/img/icons/sun.svg' %}" alt="">
                </div>
            </div>
        </div>
    </div>
</div>
