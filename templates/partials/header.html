{% load static %}
<div class="cm-header sticky-top">
    <div class="cm-header-menu mode">
        <div class="menu-left">
            <div class="logo-area">
                <a href="{% url 'home:home' %}"><img class="light" src="{% static 'assets/img/logo/ae_transparent_no_bg.png' %}" alt="axz" style="height: 10rem; width: auto" fetchpriority="high" decoding="async"></a>
                <a href="{% url 'home:home' %}"><img class="dark" src="{% static 'assets/img/logo/ae_transparent_no_bg.png' %}" alt="axz" style="height: 10rem; width: auto" fetchpriority="high" decoding="async"></a>
            </div>
            <div class="header-menu">
                <ul class="list-unstyled">
                    <li><a href="{% url 'home:home' %}">خانه</a></li>
                    <li><a href="{% url 'contact:contact' %}" class="hire">استخدام من!</a></li>
                </ul>
            </div>
        </div>
        <div class="cm-functionality cm-right">
            <div class="setting" >
                <div class="mode-switcher" id="theme-mode">
                    <img class="light svg" src="{% static 'assets/img/icons/moon.svg' %}" alt="" fetchpriority="high" decoding="async">
                    <img class="dark svg" src="{% static 'assets/img/icons/sun.svg' %}" alt="" fetchpriority="high" decoding="async">
                </div>
            </div>
        </div>
    </div>
</div>
